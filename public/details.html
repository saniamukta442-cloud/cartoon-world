<html lang="en">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cartoon Details - Cartoon World</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#090b10;
    color:#fff;
    font-family:Arial,sans-serif;
}

header{
    background:#151821;
    padding:15px 18px;
    display:flex;
    align-items:center;
    gap:15px;
}

.back{
    color:#fff;

    font-size:27px;
}

.logo{
    color:#ffd400;
    font-size:21px;
    font-weight:bold;
}

.container{
    max-width:950px;
    margin:auto;
    padding:20px 15px 40px;
}

.hero{
    display:grid;
    grid-template-columns:180px 1fr;
    gap:20px;
    background:#151821;
    padding:15px;
    border-radius:14px;
}

.poster{
    width:100%;
    height:260px;
    object-fit:cover;
    border-radius:10px;
}

.info h1{
    font-size:25px;
    margin-bottom:10px;
}

.rating{
    color:#ffd400;
    margin-bottom:12px;
}

.meta{
    color:#999;
    font-size:14px;
    line-height:1.8;
}

.description{
    margin-top:20px;
    background:#151821;
    padding:18px;
    border-radius:12px;
}

.description h2{
    font-size:19px;
    margin-bottom:10px;
}

.description p{
    color:#bbb;
    line-height:1.6;
}

.buttons{
    display:flex;
    gap:10px;
    margin-top:20px;
}
