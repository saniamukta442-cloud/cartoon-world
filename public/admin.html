
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cartoon World Admin</title>
  <style>
    body {
      background: #090b10;
      color: white;
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    .panel {
      max-width: 450px;
      margin: 30px auto;
      background: #151821;
      padding: 20px;
      border-radius: 12px;
    }
    input, textarea, button {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border-radius: 7px;
      border: 1px solid #333;
    }
    input, textarea {
      background: #090b10;
      color: white;
    }
    button {
      background: #ffd400;
      color: #111;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="panel">
    <h2>🎬 Cartoon World Admin</h2>
    <p>Admin Panel প্রস্তুত করা হচ্ছে।</p>
  </div>
</body>
</html>
